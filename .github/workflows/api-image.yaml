name: API Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/api-image.yaml'
      - '.github/workflows/callables/build-push/**'
      - '.github/workflows/callables/deployment/**'
      - '.github/workflows/callables/registry/**'

env:
  REGISTRY: ghcr.io
  PROJECT_NAME: comutitres

jobs:
  build-push-image:
    name: Build and push api image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Registry
        uses: ./.github/workflows/callables/registry
        with:
          token: ${{ secrets.IMAGE_TOKEN }}

      - name: Build / Push php image
        uses: ./.github/workflows/callables/build-push
        with:
          context: ./api
          dockerfile: ./api/Dockerfile
          image: php
          target: dev
          build_args: |
            JWT_PASSPHRASE=${{ secrets.BACK_JWT_PASSPHRASE }}

  deploy-image:
    name: Deploy api image
    runs-on: ubuntu-latest
    needs: build-push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy images
        uses: ./.github/workflows/callables/deployment
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          path: ${{ secrets.PROD_PATH }}
          images: 'php'

