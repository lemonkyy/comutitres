name: Front Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'
      - '.github/workflows/front-image.yaml'
      - '.github/workflows/callables/build-push/**'
      - '.github/workflows/callables/deployment/**'
      - '.github/workflows/callables/registry/**'

env:
  REGISTRY: ghcr.io
  PROJECT_NAME: comutitres

jobs:
  build-push-image:
    name: Build and push front image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Registry
        uses: ./.github/workflows/callables/registry
        with:
          token: ${{ secrets.IMAGE_TOKEN }}

      - name: Build / Push front image
        uses: ./.github/workflows/callables/build-push
        with:
          context: ./front
          dockerfile: ./front/Dockerfile
          image: front
          target: prod
          build_args: |
            NEXT_PUBLIC_URL=${{ secrets.FRONT_URL }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.FRONT_API_BASE_URL }}
            API_BASE_URL=${{ secrets.FRONT_API_BASE_URL }}

  deploy-image:
    name: Deploy front image
    runs-on: ubuntu-latest
    needs: build-push-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy images
        uses: ./.github/workflows/callables/deployment
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          path: ${{ secrets.PROD_PATH }}
          images: 'front'
