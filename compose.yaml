services:
  php:
    depends_on:
      - db
    build:
      context: ./api
      target: ${DOCKER_TARGET:-dev}
    working_dir: /app

  pma:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
    depends_on:
      - db

  db:
    image: mariadb:12.3

  front:
    build:
      context: ./front
      target: ${DOCKER_TARGET:-dev}

  storybook:
    build:
      context: ./front
      target: ${DOCKER_TARGET:-dev}
    command:
      - pnpm
      - storybook
      - --host
      - 0.0.0.0
      - --no-open
      - --disable-telemetry

  mailbox:
    image: mailhog/mailhog

volumes:
  db_data:
